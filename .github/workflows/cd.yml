name: CD - Build & Publish Containers

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: CI Quality & Security Gate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deployment-gate:
    name: Production Approval Gate
    needs: [verify]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://cubiora.samlapspeed.com
    steps:
      - name: Validate Release Ref
        run: |
          echo "Aprobación de despliegue en producción concedida para \`${{ github.ref }}\` (\`${{ github.sha }}\`)." >> "$GITHUB_STEP_SUMMARY"

  publish-containers:
    name: Build & Push Container (${{ matrix.service }})
    needs: [deployment-gate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            image_name: cubiora-api
          - service: web
            dockerfile: docker/Dockerfile.web
            image_name: cubiora-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment-summary:
    name: Production Release Summary
    needs: [publish-containers]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "### 🚀 Despliegue de Contenedores Completado" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repositorio:** \`${{ github.repository }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Registro:** \`${{ env.REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Imágenes Publicadas:**" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`${{ env.REGISTRY }}/${{ github.repository_owner }}/cubiora-api:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  - \`${{ env.REGISTRY }}/${{ github.repository_owner }}/cubiora-web:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Los contenedores están disponibles para orquestación mediante Docker Compose o Kubernetes." >> "$GITHUB_STEP_SUMMARY"

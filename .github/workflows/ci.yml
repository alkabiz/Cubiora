name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cubiora_test
          POSTGRES_USER: cubiora_test
          POSTGRES_PASSWORD: cubiora_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cubiora_test:cubiora_test_password@localhost:5432/cubiora_test
      DIRECT_URL: postgresql://cubiora_test:cubiora_test_password@localhost:5432/cubiora_test
      SESSION_SECRET: ci_test_session_secret_at_least_32_characters_long
      DISPLAY_TOKEN: ci_test_display_token_at_least_32_characters_long
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.11.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter api prisma:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Security Audit (Production Dependencies)
        run: pnpm audit --prod

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Vitest tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

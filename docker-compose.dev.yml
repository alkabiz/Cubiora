services:
  postgres:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    container_name: cubiora-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: cubiora_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD requerida para inicializar el contenedor PostgreSQL 18 local}
    ports:
      - '5432:5432'
    volumes:
      - ./docker/init-dev-db.sql:/docker-entrypoint-initdb.d/01-init-dev-db.sql:ro
      - cubiora_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cubiora_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cubiora_dev_pgdata:
    name: cubiora_dev_pgdata

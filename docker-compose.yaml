# ==============================================================================
# Cubiora — Mega-Centros de Dispensación Farmacéutica (PMV Audifarma)
# Despliegue de Producción para Coolify v4.6+ (Docker Compose Engine)
# ==============================================================================

services:
  # ─── 1. Base de Datos Relacional PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubiora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD para el despliegue en producción}
      POSTGRES_DB: ${POSTGRES_DB:-cubiora}
    volumes:
      - cubiora_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cubiora} -d $${POSTGRES_DB:-cubiora}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cubiora-network

  # ─── 2. Backend API NestJS + Prisma ORM + WebSockets ────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-cubiora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cubiora}?schema=public}
      ALLOW_DOCKER_INTERNAL_DB: "true"
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-true}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET con un mínimo de 32 caracteres criptográficos}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN:-display_token_default_local_min_32_chars!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NO_SHOW_MAX_CALLS: ${NO_SHOW_MAX_CALLS:-3}
      CUBICLE_DAILY_TARGET_SECONDS: ${CUBICLE_DAILY_TARGET_SECONDS:-600}
      AWT_TARGET_SECONDS: ${AWT_TARGET_SECONDS:-900}
      TMM_TARGET_SECONDS: ${TMM_TARGET_SECONDS:-600}
      BOTTLENECK_QUEUE_SIZE_THRESHOLD: ${BOTTLENECK_QUEUE_SIZE_THRESHOLD:-15}
      BOTTLENECK_OCCUPANCY_RATE_THRESHOLD: ${BOTTLENECK_OCCUPANCY_RATE_THRESHOLD:-0.90}
      WMS_WEBHOOK_URL: ${WMS_WEBHOOK_URL:-}
      WMS_WEBHOOK_SECRET: ${WMS_WEBHOOK_SECRET:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-AdminAudifarma2026!}
      DEV_SEED_USER_PASSWORD: ${DEV_SEED_USER_PASSWORD:-AdminAudifarma2026!}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/api/v1/health/live\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - cubiora-network

  # ─── 3. Frontend Gateway Nginx + React 19 SPA (Punto de Entrada Único) ─────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cubiora-network

networks:
  cubiora-network:
    driver: bridge

volumes:
  cubiora_postgres_data:
    driver: local


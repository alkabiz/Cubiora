# ==============================================================================
# Cubiora — Mega-Centros de Dispensación Farmacéutica (PMV Audifarma)
# Despliegue de Producción para Coolify v4.6+ (Docker Compose Engine)
# Base de Datos: PostgreSQL externo con TLS verify-full y CA institucional
# ==============================================================================

services:
  # ─── 1. Backend API NestJS + Prisma ORM + WebSockets ────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL para la conexion a PostgreSQL con sslmode=verify-full}
      DIRECT_URL: ${DIRECT_URL:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      DATABASE_CA_CERT_PATH: ${DATABASE_CA_CERT_PATH:-}
      ALLOW_DOCKER_INTERNAL_DB: ${ALLOW_DOCKER_INTERNAL_DB:-false}
      ALLOW_NUMERIC_IP_EXCEPTION: ${ALLOW_NUMERIC_IP_EXCEPTION:-false}
      ALLOW_VERIFY_CA_EXCEPTION: ${ALLOW_VERIFY_CA_EXCEPTION:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
      RESET_SEED_PASSWORDS: ${RESET_SEED_PASSWORDS:-false}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET con un minimo de 32 caracteres criptograficos}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cubiora.samlapspeed.com,https://coolify.samlapspeed.com,http://localhost:5173,http://localhost,http://127.0.0.1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NO_SHOW_MAX_CALLS: ${NO_SHOW_MAX_CALLS:-3}
      CUBICLE_DAILY_TARGET_SECONDS: ${CUBICLE_DAILY_TARGET_SECONDS:-600}
      AWT_TARGET_SECONDS: ${AWT_TARGET_SECONDS:-900}
      TMM_TARGET_SECONDS: ${TMM_TARGET_SECONDS:-600}
      BOTTLENECK_QUEUE_SIZE_THRESHOLD: ${BOTTLENECK_QUEUE_SIZE_THRESHOLD:-15}
      BOTTLENECK_OCCUPANCY_RATE_THRESHOLD: ${BOTTLENECK_OCCUPANCY_RATE_THRESHOLD:-0.90}
      WMS_WEBHOOK_URL: ${WMS_WEBHOOK_URL:-}
      WMS_WEBHOOK_SECRET: ${WMS_WEBHOOK_SECRET:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DEV_SEED_USER_PASSWORD: ${DEV_SEED_USER_PASSWORD:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:3000/api/v1/health/live\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - cubiora-network

  # ─── 2. Frontend Gateway Nginx + React 19 SPA (Punto de Entrada Unico) ─────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cubiora-network

networks:
  cubiora-network:
    driver: bridge
